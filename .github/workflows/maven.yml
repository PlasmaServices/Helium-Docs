name: Buildmaster 3000

on:
  push:
    branches:
      - API
  pull_request:
    branches:
      - API

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Get short commit SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn -B clean install
        working-directory: HeliumAPI
        shell: bash

      - name: Prepare release artifacts
        run: |
          SHORT_SHA="${{ steps.git-sha.outputs.sha }}"
          mkdir -p release-artifacts
          # Verify JAR exists before moving
          if [ -f "HeliumAPI/target/HeliumAPI.jar" ]; then
            cp HeliumAPI/target/HeliumAPI.jar "release-artifacts/HeliumAPI-${SHORT_SHA}.jar"
          else
            echo "❌ Error: JAR file not found!"
            ls -la HeliumAPI/target/ # Debug output
            exit 1
          fi

      - name: Delete old release
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
            jq -r '.id')
          
          if [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting old release ID: $RELEASE_ID"
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: "Build ${{ github.run_number }} (${{ steps.git-sha.outputs.sha }})"
          body: |
            ✅ Automatic build from GitHub Actions
            - Commit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Triggered by: @${{ github.actor }}
          files: |
            release-artifacts/HeliumAPI-*.jar
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force update tag
        if: github.event_name == 'push'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -fa latest-build -m "Automated build ${{ github.run_number }}"
          git push origin latest-build --force
